<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style type="text/css">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .hint {
      color: #888;
      font-size: 13px;
      margin: 6px 0 0;
    }
    .result {
      min-height: 20px;
      margin: 10px 0 0;
      word-break: break-word;
    }
    .result.ok {
      color: #17a34a;
    }
    .result.error {
      color: #d0021b;
    }
    .result.busy {
      color: #666;
    }
    .secondary {
      margin-top: 8px;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 28px 0;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .slider-row { margin-bottom: 14px; }
    .slider-row label {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .slider-line { display: flex; align-items: center; gap: 10px; }
    .slider-line input[type=range] { flex: 1; accent-color: #0aa1dd; }
    .slider-line output {
      min-width: 38px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .buttons button { flex: 1; min-width: 110px; }
  </style>
</head>
<body>
  <h2 data-i18n="settings.title"></h2>
  <p data-i18n="settings.intro"></p>

  <div class="field">
    <label data-i18n="settings.remote_id"></label>
    <input type="text" id="remote_id" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </div>

  <div class="field">
    <label data-i18n="settings.api_key"></label>
    <input type="text" id="api_key" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <p class="hint" data-i18n="settings.where"></p>
  </div>

  <div class="field">
    <label data-i18n="settings.test_device_id"></label>
    <input type="text" id="test_device_id" placeholder="a1b2c3d4e5f6" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <p class="hint" data-i18n="settings.test_device_id_hint"></p>
  </div>

  <button id="save" class="homey-button-primary-full" onclick="smarwiSave()" data-i18n="settings.save"></button>
  <button id="test_cloud" class="homey-button-secondary-full secondary" onclick="smarwiTestCloud()" data-i18n="settings.test_cloud"></button>
  <p class="result" id="cloud_result"></p>

  <hr />

  <h2 data-i18n="settings.local_title"></h2>

  <div class="field">
    <label data-i18n="settings.test_address"></label>
    <input type="text" id="test_address" placeholder="192.168.1.50" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <p class="hint" data-i18n="settings.test_address_hint"></p>
  </div>

  <button id="test_local" class="homey-button-secondary-full" onclick="smarwiTestLocal()" data-i18n="settings.test_local"></button>
  <p class="result" id="local_result"></p>

  <hr />

  <h2 data-i18n="settings.finetune_title"></h2>
  <p data-i18n="settings.finetune_intro"></p>

  <div class="field">
    <label data-i18n="settings.finetune_device"></label>
    <select id="finetune_device"></select>
  </div>

  <div id="finetune_sliders"></div>

  <div class="buttons">
    <button class="homey-button-secondary" onclick="smarwiFinetune('apply')" data-i18n="settings.finetune_apply"></button>
    <button class="homey-button-primary" onclick="smarwiFinetune('save')" data-i18n="settings.finetune_save"></button>
    <button class="homey-button-danger" onclick="smarwiFinetuneReset()" data-i18n="settings.finetune_reset"></button>
  </div>
  <p class="result" id="finetune_result"></p>

  <hr />

  <h2 data-i18n="settings.web_title"></h2>
  <p data-i18n="settings.web_intro"></p>
  <ul id="device_links"></ul>

  <hr />

  <h2 data-i18n="settings.scan_title"></h2>
  <div class="field">
    <label data-i18n="settings.scan_subnet"></label>
    <input type="text" id="scan_subnet" placeholder="192.168.0" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <p class="hint" data-i18n="settings.scan_hint"></p>
  </div>

  <button id="save_scan" class="homey-button-primary-full" onclick="smarwiSave()" data-i18n="settings.save"></button>
  <p class="result" id="status"></p>

  <script type="text/javascript">
    // Inline onclick + global functions, because event listeners attached here
    // do not always survive the Homey frontend rendering the page.
    function smarwiSave() {
      if (typeof window.smarwiOnSave === 'function') window.smarwiOnSave();
    }

    function smarwiTestCloud() {
      if (typeof window.smarwiOnTestCloud === 'function') window.smarwiOnTestCloud();
    }

    function smarwiTestLocal() {
      if (typeof window.smarwiOnTestLocal === 'function') window.smarwiOnTestLocal();
    }

    function smarwiFinetune(mode) {
      if (typeof window.smarwiOnFinetune === 'function') window.smarwiOnFinetune(mode);
    }

    function smarwiFinetuneReset() {
      if (typeof window.smarwiOnFinetuneReset === 'function') window.smarwiOnFinetuneReset();
    }

    function onHomeyReady(Homey) {
      Homey.ready();

      var fields = ['remote_id', 'api_key', 'scan_subnet', 'test_device_id', 'test_address'];

      function value(id) {
        return document.getElementById(id).value.trim();
      }

      function show(id, text, kind) {
        var element = document.getElementById(id);
        element.textContent = text || '';
        element.className = 'result' + (kind ? ' ' + kind : '');
      }

      function translate(key, fallback) {
        try {
          var text = Homey.__(key);
          if (text && text !== key) return text;
        } catch (err) {
          // fall through
        }
        return fallback;
      }

      /** Homey.api() is promise-based in some versions, callback-based in others. */
      function api(method, path, body) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          var done = function (fn, arg) {
            if (settled) return;
            settled = true;
            fn(arg);
          };

          try {
            var result = Homey.api(method, path, body, function (err, res) {
              if (err) {
                done(reject, err instanceof Error ? err : new Error(String(err.message || err)));
              } else {
                done(resolve, res);
              }
            });

            if (result && typeof result.then === 'function') {
              result.then(function (res) { done(resolve, res); },
                function (err) {
                  done(reject, err instanceof Error ? err : new Error(String(err.message || err)));
                });
            }
          } catch (err) {
            done(reject, err);
          }
        });
      }

      function runTest(resultId, path, body) {
        show(resultId, translate('settings.testing', 'Testing…'), 'busy');

        api('POST', path, body)
          .then(function (result) {
            if (!result) {
              show(resultId, 'No answer from the app.', 'error');
              return;
            }
            show(resultId, result.message, result.ok ? 'ok' : 'error');
          })
          .catch(function (err) {
            show(resultId, (err && err.message) ? err.message : String(err), 'error');
          });
      }

      fields.forEach(function (key) {
        Homey.get(key, function (err, stored) {
          if (!err && stored) document.getElementById(key).value = stored;
        });
      });

      /* ---------------- Finetune ---------------- */

      // Same nine values as the Finetune tab of the SMARWI web interface,
      // with the ranges taken from the device's own UI template.
      var FINETUNE = [
        ['ospd', 'finetune_ospd', 1, 100],
        ['ofspd', 'finetune_ofspd', 1, 100],
        ['orpwr', 'finetune_orpwr', 1, 100],
        ['ofpwr', 'finetune_ofpwr', 1, 100],
        ['ohcpwr', 'finetune_ohcpwr', 1, 100],
        ['ohopwr', 'finetune_ohopwr', 1, 100],
        ['hdist', 'finetune_hdist', -20, 20],
        ['lwid', 'finetune_lwid', 0, 40],
        ['vpct', 'finetune_vpct', 1, 100],
      ];

      var finetuneDevice = document.getElementById('finetune_device');

      function buildFinetuneSliders() {
        document.getElementById('finetune_sliders').innerHTML = FINETUNE.map(function (row) {
          return '<div class="slider-row">'
            + '<label for="ft_' + row[0] + '">' + translate('settings.' + row[1], row[0]) + '</label>'
            + '<div class="slider-line">'
            + '<input type="range" id="ft_' + row[0] + '" min="' + row[2] + '" max="' + row[3] + '" step="1" />'
            + '<output id="ft_out_' + row[0] + '">–</output>'
            + '</div></div>';
        }).join('');

        FINETUNE.forEach(function (row) {
          var input = document.getElementById('ft_' + row[0]);
          input.addEventListener('input', function () {
            document.getElementById('ft_out_' + row[0]).textContent = input.value;
          });
        });
      }

      function fillFinetune(values) {
        FINETUNE.forEach(function (row) {
          if (values[row[0]] === undefined) return;
          document.getElementById('ft_' + row[0]).value = values[row[0]];
          document.getElementById('ft_out_' + row[0]).textContent = values[row[0]];
        });

        if (values.cfdist !== undefined) {
          show('finetune_result',
            translate('settings.finetune_calibrated', 'Calibrated distance') + ': ' + values.cfdist, 'busy');
        }
      }

      function collectFinetune() {
        var values = {};
        FINETUNE.forEach(function (row) {
          values[row[0]] = Number(document.getElementById('ft_' + row[0]).value);
        });
        return values;
      }

      function loadFinetune() {
        if (!finetuneDevice.value) return;
        show('finetune_result', translate('settings.loading', 'Loading…'), 'busy');

        api('GET', '/finetune?deviceId=' + encodeURIComponent(finetuneDevice.value))
          .then(function (values) { fillFinetune(values); })
          .catch(function (err) { show('finetune_result', err.message || String(err), 'error'); });
      }

      window.smarwiOnFinetune = function (mode) {
        show('finetune_result', translate('settings.saving', 'Writing…'), 'busy');

        api('POST', '/finetune', {
          deviceId: finetuneDevice.value,
          values: collectFinetune(),
          mode: mode,
        })
          .then(function (values) {
            fillFinetune(values);
            show('finetune_result', mode === 'save'
              ? translate('settings.finetune_saved', 'Saved to the device.')
              : translate('settings.finetune_applied', 'Applied until the next reboot.'), 'ok');
          })
          .catch(function (err) { show('finetune_result', err.message || String(err), 'error'); });
      };

      window.smarwiOnFinetuneReset = function () {
        Homey.confirm(translate('settings.finetune_reset_confirm', 'Really reset to factory defaults?'),
          'warning', function (err, confirmed) {
            if (err || !confirmed) return;

            show('finetune_result', translate('settings.saving', 'Writing…'), 'busy');
            api('POST', '/finetune-reset', { deviceId: finetuneDevice.value })
              .then(function (values) {
                fillFinetune(values);
                show('finetune_result', translate('settings.finetune_was_reset', 'Reset to defaults.'), 'ok');
              })
              .catch(function (e) { show('finetune_result', e.message || String(e), 'error'); });
          });
      };

      buildFinetuneSliders();
      finetuneDevice.addEventListener('change', loadFinetune);

      // Links to each SMARWI's own web interface. It cannot be embedded here:
      // this page is served over HTTPS and the SMARWI only speaks HTTP, so a
      // browser would block it as mixed content.
      api('GET', '/devices')
        .then(function (devices) {
          var list = document.getElementById('device_links');
          list.innerHTML = '';

          if (!devices || devices.length === 0) {
            list.innerHTML = '<li>' + translate('settings.web_none', 'No devices paired yet.') + '</li>';
            return;
          }

          devices.forEach(function (device) {
            var item = document.createElement('li');
            var link = document.createElement('a');
            link.href = 'http://' + device.address;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = device.name + ' — ' + device.address;
            item.appendChild(link);
            list.appendChild(item);

            var option = document.createElement('option');
            option.value = device.id;
            option.textContent = device.name;
            finetuneDevice.appendChild(option);
          });

          if (devices.length > 0) loadFinetune();
        })
        .catch(function () {});

      window.smarwiOnSave = function () {
        show('status', '', null);

        var pending = fields.length;
        var failed = false;

        fields.forEach(function (key) {
          Homey.set(key, value(key), function (err) {
            if (err && !failed) {
              failed = true;
              show('status', err.message || String(err), 'error');
            }
            pending -= 1;
            if (pending === 0 && !failed) {
              show('status', translate('settings.saved', 'Saved.'), 'ok');
            }
          });
        });
      };

      window.smarwiOnTestCloud = function () {
        runTest('cloud_result', '/test-cloud', {
          remoteId: value('remote_id'),
          apiKey: value('api_key'),
          deviceId: value('test_device_id'),
        });
      };

      window.smarwiOnTestLocal = function () {
        runTest('local_result', '/test-local', { address: value('test_address') });
      };
    }
  </script>
</body>
</html>
