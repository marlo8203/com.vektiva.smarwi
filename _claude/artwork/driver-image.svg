<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Driver image: the SMARWI unit with its toothed ridge, on a white background.
       Author: Marian Lojka <marian.lojka@gmail.com> -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#f5f8fb"/>
      <stop offset="72%" stop-color="#e3eaf1"/>
      <stop offset="100%" stop-color="#c9d4de"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#edf1f6"/>
      <stop offset="100%" stop-color="#c4ced8"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fadbb"/>
      <stop offset="30%" stop-color="#cfd8e1"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3cedb"/>
      <stop offset="100%" stop-color="#dde5ed"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7f93a6" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#7f93a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7f93a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="led" cx="0.38" cy="0.32" r="0.72">
      <stop offset="0%" stop-color="#8fdfff"/>
      <stop offset="100%" stop-color="#0aa1dd"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="#ffffff"/>

  <ellipse cx="500" cy="712" rx="352" ry="44" fill="url(#shadow)"/>

  <!-- the toothed ridge, which the unit pulls the window sash by -->
  <g>
    <rect x="30" y="474" width="940" height="84" rx="14" fill="url(#ridge)" stroke="#9dabb9" stroke-width="4"/>
    <rect x="42" y="488" width="916" height="16" rx="8" fill="#ffffff" opacity="0.9"/>
    <g fill="#9dabb9" opacity="0.55">
      <rect x="48" y="504" width="20" height="34" rx="7"/>
      <rect x="94" y="504" width="20" height="34" rx="7"/>
      <rect x="140" y="504" width="20" height="34" rx="7"/>
      <rect x="830" y="504" width="20" height="34" rx="7"/>
      <rect x="876" y="504" width="20" height="34" rx="7"/>
      <rect x="922" y="504" width="20" height="34" rx="7"/>
    </g>
  </g>

  <!-- the unit itself -->
  <g>
    <rect x="196" y="330" width="608" height="372" rx="58" fill="url(#case)" stroke="#9dabb9" stroke-width="5"/>
    <rect x="216" y="350" width="568" height="26" rx="13" fill="#ffffff" opacity="0.95"/>
    <rect x="256" y="378" width="488" height="80" rx="26" fill="url(#grille)" opacity="0.6"/>
    <g fill="#a9b6c4" opacity="0.75">
      <rect x="292" y="398" width="416" height="9" rx="4.5"/>
      <rect x="292" y="422" width="416" height="9" rx="4.5"/>
    </g>
    <rect x="256" y="602" width="488" height="72" rx="26" fill="url(#grille)" opacity="0.45"/>
    <circle cx="704" cy="638" r="22" fill="url(#led)"/>
    <circle cx="704" cy="630" r="7.5" fill="#ffffff" opacity="0.7"/>

    <!-- where the ridge runs through the unit -->
    <rect x="196" y="474" width="608" height="84" fill="url(#slot)"/>
    <rect x="196" y="486" width="608" height="60" rx="8" fill="url(#ridge)" opacity="0.95"/>
    <rect x="196" y="474" width="608" height="84" fill="none" stroke="#9dabb9" stroke-width="4"/>
    <rect x="236" y="474" width="10" height="84" fill="#b3bfcc" opacity="0.6"/>
    <rect x="754" y="474" width="10" height="84" fill="#b3bfcc" opacity="0.6"/>
  </g>
</svg>
