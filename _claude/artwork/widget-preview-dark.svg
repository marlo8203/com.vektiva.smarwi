<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Widget preview: a simplified sketch of the Window widget.
       Author: Marian Lojka <marian.lojka@gmail.com> -->
  <defs>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2c4d61"/>
      <stop offset="100%" stop-color="#1b3849"/>
    </linearGradient>
  </defs>

  <rect x="64" y="144" width="896" height="736" rx="72" fill="#23262a" stroke="#33383e" stroke-width="6"/>

  <!-- the window, tilted open at the top, with air coming in -->
  <g>
    <rect x="128" y="232" width="304" height="376" rx="26" fill="url(#glass)" stroke="#525a63" stroke-width="9"/>
    <circle cx="286" cy="266" r="26" fill="#e0b455"/>
    <polygon points="154,582 190,300 370,300 406,582" fill="#2f3a42" stroke="#525a63" stroke-width="9" stroke-linejoin="round"/>
    <g fill="none" stroke="#22b0e8" stroke-width="15" stroke-linecap="round">
      <path d="M176 408 q46 -36 92 0"/>
      <path d="M198 486 q46 -36 92 0"/>
      <path d="M176 564 q46 -36 92 0"/>
    </g>
  </g>

  <!-- open, stop and close -->
  <rect x="488" y="232" width="392" height="104" rx="52" fill="#22b0e8"/>
  <rect x="488" y="368" width="392" height="104" rx="52" fill="#31363c"/>
  <rect x="488" y="504" width="392" height="104" rx="52" fill="#31363c"/>

  <!-- the position slider -->
  <rect x="128" y="678" width="752" height="26" rx="13" fill="#33383e"/>
  <rect x="128" y="678" width="480" height="26" rx="13" fill="#22b0e8"/>
  <circle cx="608" cy="691" r="46" fill="#3b4148" stroke="#33383e" stroke-width="6"/>

  <!-- the status tiles -->
  <rect x="128" y="774" width="232" height="72" rx="28" fill="#2c3136"/>
  <rect x="388" y="774" width="232" height="72" rx="28" fill="#2c3136"/>
  <rect x="648" y="774" width="232" height="72" rx="28" fill="#2c3136"/>
</svg>
